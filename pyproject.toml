[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-commerce"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["src/agent_commerce"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests", "eval"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
